name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/${{ github.repository }}

concurrency:
  # Um push novo torna o anterior irrelevante. Sem isto, a fila do runner enche
  # com builds de commits já superados.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e fronteiras
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Inclui os testes de arquitetura (fronteira de módulo, RLS em toda tabela,
      # dinheiro nunca double) e os de integração com Postgres real via
      # Testcontainers. O runner do GitHub já tem Docker; o profile `colima` do
      # pom não ativa aqui, porque o socket dele não existe.
      - name: mvn verify
        run: ./mvnw -B verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Empacotar jar para os próximos jobs
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 1

  seguranca:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Trivy no lugar do OWASP Dependency-Check: desde 2023 o Dependency-Check
      # exige chave da API do NVD e leva ~10 min em cache frio. O Trivy cobre as
      # mesmas dependências Java, sem chave, e ainda escaneia a imagem depois.
      - name: Dependências vulneráveis
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true   # sem correção disponível não é acionável hoje

  imagem:
    name: Imagem multi-arch
    runs-on: ubuntu-latest
    needs: [verificar, seguranca]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      # arm64 é requisito, não luxo: o alvo de deploy é uma VM Ampere.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear a imagem publicada
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGEM }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  homologacao:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: imagem
    # Pendente da máquina de homologação (risco R-11: capacidade Ampere).
    # Enquanto HMG_HOST não existir, o job é pulado em vez de falhar — pipeline
    # vermelho por infraestrutura ausente treina a equipe a ignorar vermelho.
    if: ${{ vars.HMG_HOST != '' }}
    environment: homologacao
    timeout-minutes: 10
    steps:
      - name: Publicar via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HMG_HOST }}
          username: ${{ vars.HMG_USER }}
          key: ${{ secrets.HMG_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salao
            docker compose pull
            docker compose up -d --wait
            # --wait respeita o HEALTHCHECK da imagem: se o health não passar,
            # o comando falha e o job fica vermelho, em vez de declarar sucesso
            # sobre um contêiner que subiu quebrado.
