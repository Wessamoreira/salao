name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/${{ github.repository }}

concurrency:
  # Um push novo torna o anterior irrelevante. Sem isto, a fila do runner enche
  # com builds de commits já superados.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e fronteiras
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Inclui os testes de arquitetura (fronteira de módulo, RLS em toda tabela,
      # dinheiro nunca double) e os de integração com Postgres real via
      # Testcontainers. O runner do GitHub já tem Docker; o profile `colima` do
      # pom não ativa aqui, porque o socket dele não existe.
      - name: mvn verify
        run: ./mvnw -B verify

      # Roda ANTES dos artefatos para aparecer no log mesmo quando os testes falham.
      # Não substitui revisão humana: só torna visível o que ninguém olharia sozinho —
      # rotina implementada fora da ordem, rotina documentada fora do plano, e o
      # tamanho da dívida de pendências dentro do que já foi dado como pronto.
      - name: Conferir plano contra realidade
        if: always()
        run: python3 ops/scripts/checklist.py --ci

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Empacotar jar para os próximos jobs
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar
          retention-days: 1

  front:
    name: Front — tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` e não `install`: respeita o lock e falha se ele estiver desatualizado,
      # em vez de resolver versões novas em silêncio dentro do CI.
      - name: Instalar
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `tsc -b`, o que de fato lê os arquivos. Até 22/09/2026 este script era
      # `tsc --noEmit` sobre um tsconfig sem arquivos: dizia "ok" sobre nada, e o
      # build estava quebrado havia semanas sem ninguém ver.
      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Testes
        working-directory: frontend
        run: npm test

      # O build é o único passo que prova que a tela chega ao navegador. Sem ele, um
      # import quebrado passa por lint, tipos e testes — os testes montam componentes,
      # não o pacote.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Publicar o pacote
        uses: actions/upload-artifact@v4
        with:
          name: front
          path: frontend/dist
          retention-days: 7

  seguranca:
    name: Vulnerabilidades
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Trivy no lugar do OWASP Dependency-Check: desde 2023 o Dependency-Check
      # exige chave da API do NVD e leva ~10 min em cache frio. O Trivy cobre as
      # mesmas dependências Java, sem chave, e ainda escaneia a imagem depois.
      - name: Dependências vulneráveis
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true   # sem correção disponível não é acionável hoje

  imagem:
    name: Imagem multi-arch
    runs-on: ubuntu-latest
    needs: [verificar, front, seguranca]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      # arm64 é requisito, não luxo: o alvo de deploy é uma VM Ampere.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escanear a imagem publicada
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGEM }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  homologacao:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: imagem
    # Pendente da máquina de homologação (risco R-11: capacidade Ampere).
    # Enquanto HMG_HOST não existir, o job é pulado em vez de falhar — pipeline
    # vermelho por infraestrutura ausente treina a equipe a ignorar vermelho.
    if: ${{ vars.HMG_HOST != '' }}
    environment: homologacao
    timeout-minutes: 10
    steps:
      - name: Publicar via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HMG_HOST }}
          username: ${{ vars.HMG_USER }}
          key: ${{ secrets.HMG_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/salao
            docker compose pull
            docker compose up -d --wait
            # --wait respeita o HEALTHCHECK da imagem: se o health não passar,
            # o comando falha e o job fica vermelho, em vez de declarar sucesso
            # sobre um contêiner que subiu quebrado.
