spring:
  application.name: salao
  threads.virtual.enabled: true

  # RT-FIN-009 — o extrato da maquininha é o primeiro upload. Um mês de vendas de um salão fica longe
  # disso; o caso de uso confere o mesmo limite.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # A aplicação conecta como salao_app, que NÃO é dona das tabelas (RN-INF-004).
    # Sem isso, a RLS é ignorada em silêncio para o owner.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_APP_USER:salao_app}
    # Sem valor padrão, aqui e nas demais senhas. Um padrão neste arquivo — que é
    # versionado — significa que subir em produção esquecendo a variável de
    # ambiente faz a aplicação funcionar com uma senha publicada no repositório.
    # Falhar na subida é barulhento e imediato; a alternativa é silenciosa e
    # dura até alguém descobrir. Os valores de desenvolvimento vivem no perfil
    # dev, onde é evidente que são de desenvolvimento.
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Curto de propósito: com virtual threads o gargalo passa a ser o pool (risco R-18).
      # Falhar rápido é melhor que empilhar mil requisições esperando conexão.
      connection-timeout: 3000

  flyway:
    enabled: true
    # Migration roda como OWNER: precisa criar tabela, role e política, e enxergar tudo.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    user: ${DB_OWNER_USER:salao_owner}
    password: ${DB_OWNER_PASSWORD}

  jpa:
    hibernate.ddl-auto: validate     # nunca 'update' — ver CLAUDE.md, inviolável nº 9
    open-in-view: false
    properties:
      hibernate:
        query.fail_on_pagination_over_collection_fetch: true
        generate_statistics: ${HIBERNATE_STATS:false}
        jdbc.time_zone: UTC

app:
  # Conexão da role de manutenção: purga de idempotência, expurgo de outbox e
  # retenção de auditoria. Separada de propósito — ver V4__idempotencia.sql.
  manutencao:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_MANUTENCAO_USER:salao_manutencao}
    password: ${DB_MANUTENCAO_PASSWORD}
  idempotencia:
    retencao: ${IDEMPOTENCIA_RETENCAO:P7D}

spring.modulith.events:
  # Schema vem do Flyway (V5), nunca de inicializador em runtime.
  jdbc.schema-initialization.enabled: false
  # ARCHIVE em vez de DELETE: mantém rastro de "esta notificação saiu?" por
  # alguns dias, que é a pergunta real do suporte. DELETE apagaria a resposta;
  # UPDATE deixaria a tabela quente crescer para sempre (risco R-12).
  completion-mode: archive
  # Desligado: o republish do Modulith roda no startup SEM tenant no escopo, e
  # toda transação aqui exige um. Quem reenvia é o ReenviadorDeEventos, que
  # percorre estabelecimento por estabelecimento.
  republish-outstanding-events-on-restart: false

app.outbox:
  retencao-arquivo: ${OUTBOX_RETENCAO:P14D}
  idade-minima-para-reenvio: ${OUTBOX_IDADE_REENVIO:PT5M}

server:
  tomcat:
    # RT-FIN-009 — sem isto, um upload acima do limite fazia o Tomcat fechar a conexão sem ler o
    # resto do corpo, e quem enviou via "a conexão caiu" em vez do 413 que explica o limite. Lê e
    # descarta até 10 MB para responder direito; acima disso, fecha — ler sem teto seria porta aberta.
    max-swallow-size: 10MB

management:
  # Porta separada: enquanto não houver Spring Security (RT-IAM-002), tirar o
  # /actuator da porta pública é a proteção que dá para ter hoje. Métrica de
  # negócio e health interno não são endpoint de aplicação.
  # 127.0.0.1 por padrão: o actuator não é alcançável da rede, só de dentro da
  # máquina. Health e métrica precisam ser legíveis por sonda de contêiner e por
  # scraper, que não carregam token — então a proteção não pode ser autenticação,
  # e passa a ser alcance. Expor numa interface privada é decisão de quem opera,
  # feita por variável, com o firewall que a acompanha.
  server.address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  server.port: ${MANAGEMENT_PORT:9090}
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: always
  observations.annotations.enabled: true

  # tracing: ver docs/modulos/infra/RT-INF-008 — a fiação do OpenTelemetry no Boot 4.1
  # não foi resolvida, e manter a dependência produzia um noopTracer, que é a
  # aparência de tracing sem tracing.

logging:
  level.br.com.salao: ${LOG_LEVEL:INFO}
  structured:
    # JSON em arquivo sempre; no console só fora de dev, onde ninguém lê JSON com o olho.
    format.file: ${LOG_FORMAT:ecs}
    json.context.include: true
  file.name: ${LOG_FILE:logs/salao.log}
  pattern.correlation: "[${spring.application.name:salao},%X{traceId:-},%X{spanId:-}] "

app.jwt:
  # Sem valor padrão de propósito: a aplicação não sobe sem um segredo definido.
  # Um padrão em código vira o segredo de produção de alguém.
  segredo: ${JWT_SEGREDO}
  validade-do-acesso: ${JWT_VALIDADE:PT15M}
  emissor: ${JWT_EMISSOR:salao}

app.rede:
  # Doze tentativas por minuto por IP nas rotas de autenticação. Quem entra no salão erra
  # a senha duas ou três vezes; vinte é ataque. O limite geral é largo porque abrir a
  # agenda dispara várias chamadas de uma vez.
  limite-autenticacao: ${LIMITE_AUTENTICACAO:12}
  limite-geral: ${LIMITE_GERAL:300}
  # Só ligue se NADA alcançar a aplicação sem passar pelo proxy — ver EnderecoDoCliente.
  atras-de-proxy: ${ATRAS_DE_PROXY:false}

app.cors:
  # Lista explícita, nunca curinga. Vazia por padrão: sem front declarado, nenhuma
  # origem cruzada é permitida.
  origens: ${CORS_ORIGENS:}

app.whatsapp:
  # RT-CNV-001 — as credenciais do APP da Meta, não do salão: um app serve todos os
  # números, e a assinatura é a mesma para todos. Por isso vivem aqui e não no banco.
  #
  # Padrão VAZIO, ao contrário do segredo do JWT — e a diferença é deliberada. Sem JWT a
  # aplicação não serve para nada e não deve subir; sem WhatsApp ela serve para tudo menos
  # para o agente (ADR-0006: nenhum provedor contratado ainda).
  #
  # Vazio significa DESLIGADO, nunca ABERTO: o webhook recusa toda requisição com 503 e a
  # subida registra um aviso. Aceitar por não ter como validar transformaria uma variável
  # esquecida em permissão para gravar mensagem em nome de qualquer salão.
  app-secret: ${WHATSAPP_APP_SECRET:}
  # O token que a Meta devolve no handshake de cadastro da URL. Comparado em tempo
  # constante: a rota é pública, e um equals entrega o token pelo tempo de resposta.
  token-de-verificacao: ${WHATSAPP_TOKEN_VERIFICACAO:}
  # RT-CNV-003 — token do usuário de sistema do app, para BAIXAR mídia. É outra credencial: o
  # app-secret AUTENTICA o webhook; este token AUTORIZA ler da Graph API. Vazio significa que o áudio
  # espera na fila sem gastar tentativa — e não que o download é tentado sem credencial.
  token-de-acesso: ${WHATSAPP_TOKEN_ACESSO:}
  # A versão da Graph API muda; a Meta desliga as antigas em cerca de dois anos. Conferir no runbook.
  graph-url: ${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}
  audio:
    intervalo: ${WHATSAPP_AUDIO_INTERVALO:PT30S}
  # RT-CNV-006 — a saída para a equipe (resposta do agente, pedido de confirmação, pedido de aceite).
  # Sem provedor de envio as mensagens esperam na fila; nada é marcado como enviado sem ter saído.
  saida:
    intervalo: ${WHATSAPP_SAIDA_INTERVALO:PT5S}

app.agente:
  # RT-CNV-004 — o modelo de linguagem. Sem chave, o agente não roda: as mensagens ficam na fila.
  chave-api: ${AGENTE_CHAVE_API:}
  modelo: ${AGENTE_MODELO:claude-opus-5}
  # Sem valor padrão, de propósito. Sem preço não há como calcular custo, e sem custo não há teto
  # (R-17): o agente não roda enquanto os dois não forem informados. Um padrão aqui seria uma tabela
  # de preço inventada, desatualizada no dia em que o provedor mudasse.
  preco:
    entrada-por-milhao-usd: ${AGENTE_PRECO_ENTRADA:}
    saida-por-milhao-usd: ${AGENTE_PRECO_SAIDA:}
  # Por salão, por dia civil no fuso do salão. Atingido, o agente para de chamar o modelo até virar
  # o dia.
  teto-diario-usd: ${AGENTE_TETO_DIARIO_USD:2.00}
  # RT-CNV-010 — quanto do teto acima quem NÃO é da equipe pode gastar. Metade, por decisão do dono
  # (27/09/2026): estourado este pote, a cliente deixa de ser respondida e a equipe continua
  # trabalhando. Sem ele, cem números errados de madrugada deixariam a recepção sem agente no dia.
  teto-diario-do-visitante-usd: ${AGENTE_TETO_VISITANTE_USD:1.00}
  # Conversas por telefone por hora. Protege o teto de um único número em laço — e de quem descobriu
  # o número da recepção.
  limite-por-telefone-por-hora: ${AGENTE_LIMITE_TELEFONE_HORA:30}
  intervalo: ${AGENTE_INTERVALO:PT15S}
  # RT-CNV-009 — quanto o agente espera a pessoa terminar de falar. Quem manda "oi", pensa e manda o
  # resto fez UM pedido: a janela é o silêncio depois do qual a rajada vira uma volta só do modelo.
  # Quinze segundos é o tempo de digitar a segunda frase.
  janela-de-agregacao: ${AGENTE_JANELA:PT15S}
  # E o quanto uma rajada pode segurar o agente. Nada espera para sempre: transcrição travada,
  # provedor fora do ar, ou quem não para de escrever. Vencido, responde-se com o que se tem.
  teto-de-espera: ${AGENTE_TETO_DE_ESPERA:PT2M}
  # RT-CNV-005 — por quanto tempo o pedido de confirmação vale. Depois disso "SIM 4821" não grava
  # nada: a pessoa pede de novo, e o horário é conferido de novo. ISO-8601 (PT10M).
  intencao:
    validade: ${AGENTE_INTENCAO_VALIDADE:PT10M}
  # RT-CNV-006 — por quanto tempo quem vai atender pode aceitar um horário fora da jornada, contado do
  # SIM de quem pediu. Fora da jornada ela, por definição, não está trabalhando: não responde em
  # minutos. Vencido, quem pediu é avisado e nada é gravado.
  aceite:
    validade: ${AGENTE_ACEITE_VALIDADE:PT2H}
    intervalo: ${AGENTE_ACEITE_INTERVALO:PT1M}
  # RT-CNV-007 — a trilha do agente (acao_ia). O conteúdo — mensagem, resposta, telefone, argumentos —
  # sai aos 90 dias; a linha, aos 12 meses (docs/04). ISO-8601.
  acao-ia:
    anonimizar-apos: ${AGENTE_ACAO_IA_ANONIMIZAR:P90D}
    apagar-apos: ${AGENTE_ACAO_IA_APAGAR:P365D}

app.cripto:
  # AES-256 em Base64 (32 bytes). Sem padrão: a aplicação não sobe sem chave, porque
  # um padrão em código vira a chave de produção de alguém. Gere com
  # CofreDeCampo.novaChaveBase64().
  chave: ${CRIPTO_CHAVE}

app.auth:
  mfa:
    # Quanto tempo vale o desafio entre "senha conferida" e os seis dígitos. É uma credencial
    # parcial em trânsito, então é curto — mas não tanto que expire enquanto alguém configura o
    # autenticador pela primeira vez e é mandado de volta para a tela de senha sem entender por quê.
    validade-do-desafio: ${MFA_VALIDADE_DESAFIO:PT15M}
  refresh:
    validade: ${REFRESH_VALIDADE:P30D}
    # Reenvio do cliente por rede instável chega com o mesmo refresh. Dentro desta
    # janela a segunda tentativa é recusada SEM revogar a família — derrubar a
    # sessão de quem só teve internet ruim seria um falso positivo caro.
    tolerancia-de-reenvio: ${REFRESH_TOLERANCIA:PT10S}
    # Guardar além do vencimento é o que permite responder, numa investigação,
    # quando a sessão foi encerrada e a partir de qual IP.
    retencao-alem-do-vencimento: ${REFRESH_RETENCAO:P30D}
  # Em dev o navegador descarta cookie Secure sobre http. Nunca false em produção.
  cookie-seguro: ${COOKIE_SEGURO:true}

app.auditoria:
  # 5 anos para agenda e financeiro: é o prazo em que ainda aparece disputa com
  # cliente sobre horário ou com profissional sobre repasse.
  retencao-critica: ${AUDITORIA_RETENCAO_CRITICA:P1825D}
  # 1 ano para o resto: passado isso não responde mais nada, e guardar dado
  # pessoal sem finalidade contraria a minimização da LGPD.
  retencao-padrao: ${AUDITORIA_RETENCAO_PADRAO:P365D}

app.observabilidade:
  # Acima disto o outbox é considerado parado, e o health passa a reportar
  # degradado. Casado com o alerta de 5 min do Prometheus.
  outbox-parado-apos: ${OUTBOX_PARADO_APOS:PT5M}
