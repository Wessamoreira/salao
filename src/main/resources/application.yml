spring:
  application.name: salao
  threads.virtual.enabled: true

  datasource:
    # A aplicação conecta como salao_app, que NÃO é dona das tabelas (RN-INF-004).
    # Sem isso, a RLS é ignorada em silêncio para o owner.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_APP_USER:salao_app}
    password: ${DB_APP_PASSWORD:salao_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Curto de propósito: com virtual threads o gargalo passa a ser o pool (risco R-18).
      # Falhar rápido é melhor que empilhar mil requisições esperando conexão.
      connection-timeout: 3000

  flyway:
    enabled: true
    # Migration roda como OWNER: precisa criar tabela, role e política, e enxergar tudo.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    user: ${DB_OWNER_USER:salao_owner}
    password: ${DB_OWNER_PASSWORD:salao_owner_dev}
    placeholders:
      senha_app: ${DB_APP_PASSWORD:salao_app_dev}
      senha_manutencao: ${DB_MANUTENCAO_PASSWORD:salao_manutencao_dev}

  jpa:
    hibernate.ddl-auto: validate     # nunca 'update' — ver CLAUDE.md, inviolável nº 9
    open-in-view: false
    properties:
      hibernate:
        query.fail_on_pagination_over_collection_fetch: true
        generate_statistics: ${HIBERNATE_STATS:false}
        jdbc.time_zone: UTC

app:
  # Conexão da role de manutenção: purga de idempotência, expurgo de outbox e
  # retenção de auditoria. Separada de propósito — ver V4__idempotencia.sql.
  manutencao:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salao}
    username: ${DB_MANUTENCAO_USER:salao_manutencao}
    password: ${DB_MANUTENCAO_PASSWORD:salao_manutencao_dev}
  idempotencia:
    retencao: ${IDEMPOTENCIA_RETENCAO:P7D}

spring.modulith.events:
  # Schema vem do Flyway (V5), nunca de inicializador em runtime.
  jdbc.schema-initialization.enabled: false
  # ARCHIVE em vez de DELETE: mantém rastro de "esta notificação saiu?" por
  # alguns dias, que é a pergunta real do suporte. DELETE apagaria a resposta;
  # UPDATE deixaria a tabela quente crescer para sempre (risco R-12).
  completion-mode: archive
  # Desligado: o republish do Modulith roda no startup SEM tenant no escopo, e
  # toda transação aqui exige um. Quem reenvia é o ReenviadorDeEventos, que
  # percorre estabelecimento por estabelecimento.
  republish-outstanding-events-on-restart: false

app.outbox:
  retencao-arquivo: ${OUTBOX_RETENCAO:P14D}
  idade-minima-para-reenvio: ${OUTBOX_IDADE_REENVIO:PT5M}

management:
  # Porta separada: enquanto não houver Spring Security (RT-IAM-002), tirar o
  # /actuator da porta pública é a proteção que dá para ter hoje. Métrica de
  # negócio e health interno não são endpoint de aplicação.
  server.port: ${MANAGEMENT_PORT:9090}
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: always
  observations.annotations.enabled: true

  tracing.sampling.probability: ${TRACE_SAMPLE:0.1}

logging:
  level.br.com.salao: ${LOG_LEVEL:INFO}
  structured:
    # JSON em arquivo sempre; no console só fora de dev, onde ninguém lê JSON com o olho.
    format.file: ${LOG_FORMAT:ecs}
    json.context.include: true
  file.name: ${LOG_FILE:logs/salao.log}
  pattern.correlation: "[${spring.application.name:salao},%X{traceId:-},%X{spanId:-}] "

app.observabilidade:
  # Acima disto o outbox é considerado parado, e o health passa a reportar
  # degradado. Casado com o alerta de 5 min do Prometheus.
  outbox-parado-apos: ${OUTBOX_PARADO_APOS:PT5M}
